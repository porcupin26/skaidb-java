name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, package (jar + sources + javadoc)
        run: ./mvnw -B -ntp verify
      - name: Examples compile against the built classes
        run: |
          mkdir -p /tmp/examples-out
          javac -Xlint:all -Werror -cp target/classes -d /tmp/examples-out examples/*.java
      - name: The jar manifest carries the version the driver announces
        run: |
          unzip -p target/skaidb-java-*[0-9].jar META-INF/MANIFEST.MF | tr -d '\r' | grep -E '^Implementation-Version: ' 
          ls -l target/*.jar
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: jars
          path: target/*.jar
